name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify MJCF export matches committed assets
        run: |
          npm run export:mjcf
          git diff --ignore-cr-at-eol --exit-code mujoco/humanoid_robot
          test -z "$(git ls-files --others --exclude-standard mujoco/humanoid_robot)"

  mujoco-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU viewer & ONNX dependencies
        run: python -m pip install -r mujoco/rl/requirements-viewer.txt
      - name: Phase 1 MuJoCo physics validation
        run: python mujoco/verify_mujoco.py
      - name: Phase 2 closed-loop controller & representative ROM sweep
        run: python mujoco/phase2_controller.py
      - name: Phase 3 ONNX CPU benchmark & strict CI gate
        run: python mujoco/rl/eval_benchmark.py --ci
